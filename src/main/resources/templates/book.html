<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book Freelancer</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f7ff;
            text-align: center;
        }
        h1 { margin-top: 40px; font-size: 45px; }
        .card {
            width: 450px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.2);
            text-align: left;
        }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input {
            width: 95%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 15px;
        }
        input[readonly] { background: #f0f0f0; color: #555; }
        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background: #0b57d0;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
        button:hover { background: #063a9a; }
        .slots {
            background: #eef5ff;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
        }
        .slots h3 { margin: 0; margin-bottom: 10px; }
    </style>
</head>
<body>

<h1>Book Service</h1>

<div class="card">

    <div class="slots">
        <h3>Already Booked Slots</h3>
        <ul>
            <li th:each="a : ${appointments}">
                <span th:text="${a.date}"></span> :
                <span th:text="${a.startTime}"></span> -
                <span th:text="${a.endTime}"></span>
            </li>
        </ul>
    </div>

    <form th:action="@{/book/{id}(id=${provider.id})}" method="post">

        <!-- ✅ Freelancer email passed automatically as hidden field -->
        <input type="hidden" name="freelancerEmail" th:value="${provider.email}">

        <label>Client Name</label>
        <input type="text" name="clientName"
               th:value="${loggedUser.email}" readonly>

        <label>Client Email</label>
        <input type="email" name="clientEmail"
               th:value="${loggedUser.email}" readonly>

        <label>Service</label>
        <input type="text" th:value="${provider.serviceType}" readonly>

        <label>Your Home Address</label>
        <input type="text" name="homeAddress" placeholder="e.g. 123 Main St, City" required>

        <label>Date</label>
        <input type="date" name="date" required>

        <label>Start Time</label>
        <input type="time" name="start" required>

        <label>End Time</label>
        <input type="time" name="end" required>

        <button type="submit">Confirm Booking</button>

    </form>
</div>

</body>
</html>
