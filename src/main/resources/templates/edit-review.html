<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #f2f7ff; }</style>
</head>
<body>

<div class="container mt-5" style="max-width: 500px;">
    <h2 class="text-center mb-4">Edit Your Review</h2>

    <div class="card shadow">
        <div class="card-body">
            <form th:action="@{'/reviews/' + ${review.id} + '/edit'}" method="post">

                <div class="mb-3">
                    <label class="form-label">Rating</label>
                    <select name="rating" class="form-select" required>
                        <option value="5" th:selected="${review.rating == 5}">★★★★★ (5)</option>
                        <option value="4" th:selected="${review.rating == 4}">★★★★☆ (4)</option>
                        <option value="3" th:selected="${review.rating == 3}">★★★☆☆ (3)</option>
                        <option value="2" th:selected="${review.rating == 2}">★★☆☆☆ (2)</option>
                        <option value="1" th:selected="${review.rating == 1}">★☆☆☆☆ (1)</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Comment</label>
                    <textarea name="comment" class="form-control" rows="4" required
                              th:text="${review.comment}"></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100">Save Changes</button>
            </form>
        </div>
    </div>

    <a th:href="@{'/reviews/' + ${review.provider.id}}" class="btn btn-secondary mt-3">← Cancel</a>
</div>

</body>
</html>
