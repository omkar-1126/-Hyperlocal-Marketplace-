<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hyperlocal Freelance Marketplace</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #e3f2fd, #ffffff);
            text-align: center;
        }
        h1 {
            margin-top: 30px;
            font-size: 40px;
            color: #2c3e50;
        }
        p {
            font-size: 20px;
            color: #555;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 50px;
        }
        .card {
            width: 260px;
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            animation: float 3s ease-in-out infinite;
            transition: transform 0.3s;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
        }
        .card h3 {
            margin-top: 12px;
            color: #1565c0;
        }
        .buttons {
            margin-top: 40px;
        }
        .btn {
            padding: 12px 25px;
            margin: 10px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            background-color: #1565c0;
            color: white;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #0d47a1;
        }
        @keyframes float {
            0%   { transform: translateY(0px); }
            50%  { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>
    <h1>Hyperlocal Freelance Marketplace</h1>
    <p>Find Trusted Local Freelancers Near You</p>

    <div class="container">
        <div class="card">
            <img src="/images/tutor1.jpg" alt="Tutor">
            <h3>Home Tutoring</h3>
            <p>Find nearby tutors for all subjects</p>
        </div>
        <div class="card">
            <img src="/images/plumber1.jpg" alt="Plumber">
            <h3>Plumbing Services</h3>
            <p>Quick repair and maintenance services</p>
        </div>
        <div class="card">
            <img src="/images/elec1.jpg" alt="Electrician">
            <h3>Electrical Works</h3>
            <p>Certified electricians near your area</p>
        </div>
    </div>

    <div class="buttons">
        <a href="/register-client"><button class="btn">Register as Client</button></a>
        <a href="/login"><button class="btn">Login</button></a>
        <a href="/register-freelancer"><button class="btn">Register as Freelancer</button></a>
    </div>
</body>
</html>
