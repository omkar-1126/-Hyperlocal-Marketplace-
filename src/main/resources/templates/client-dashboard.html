<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Client Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f7ff;
            text-align: center;
        }

        h1 {
            margin-top: 40px;
            font-size: 50px;
            font-weight: bold;
        }

        p {
            font-size: 18px;
            margin-top: -10px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 60px;
            flex-wrap: wrap;
        }

        .card {
            width: 330px;
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.15);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .card img {
            width: 100%;
            height: 200px;
            border-radius: 15px;
            object-fit: cover;
        }

        .card h2 {
            margin-top: 20px;
            font-size: 24px;
        }

        .btn {
            margin-top: 20px;
            padding: 12px 30px;
            border: none;
            background: #0b57d0;
            color: white;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #063a9a;
        }

        .all-btn {
            margin-top: 50px;
        }

        .all-btn a button {
            padding: 14px 40px;
            font-size: 18px;
            border-radius: 35px;
            background: #0077ff;
        }
    </style>
</head>
<body>

<h1>Welcome Client 👋</h1>
<p>Select a service and book a freelancer</p>

<div class="container">

    <div class="card">
        <img src="/images/tutor1.jpg" alt="Tutor">
        <h2>Home Tutor</h2>
        <a href="/view-services?type=Tutor"><button class="btn">View Tutors</button></a>
    </div>

    <div class="card">
        <img src="/images/plumber1.jpg" alt="Plumber">
        <h2>Plumber</h2>
        <a href="/view-services?type=Plumber"><button class="btn">View Plumbers</button></a>
    </div>

    <div class="card">
        <img src="/images/elec1.jpg" alt="Electrician">
        <h2>Electrician</h2>
        <a href="/view-services?type=Electrician"><button class="btn">View Electricians</button></a>
    </div>

</div>

<div class="all-btn">
    <a href="/view-services?type=all"><button class="btn">View All Freelancers</button></a>
</div>

</body>
</html>
