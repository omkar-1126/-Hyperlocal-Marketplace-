<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Freelancers</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f7ff;
            text-align: center;
        }

        h1 {
            margin-top: 40px;
            font-size: 50px;
        }

        p {
            margin-top: -10px;
            font-size: 18px;
        }

        table {
            width: 85%;
            margin: 50px auto;
            border-collapse: collapse;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
        }

        th {
            background: #0b57d0;
            color: white;
            padding: 15px;
            font-size: 18px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            font-size: 16px;
        }

        tr:hover {
            background: #f0f6ff;
        }

        .book-btn {
            padding: 10px 25px;
            border: none;
            border-radius: 25px;
            background: #0b57d0;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .book-btn:hover {
            background: #063a9a;
        }

        .back-btn {
            margin-top: 30px;
            padding: 12px 35px;
            border: none;
            border-radius: 30px;
            background: #0077ff;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .back-btn:hover {
            background: #005ad1;
        }

        .review {
            font-size: 14px;
            color: #444;
        }

        .stars {
            color: orange;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1 th:text="${pageTitle}">Available Freelancers</h1>
<p>Select a freelancer and click Book to confirm your service</p>

<table>
    <tr>
        <th>Name</th>
        <th>Service</th>
        <th>Location</th>
        <th>Experience</th>
        <th>Phone</th>
        <th>Reviews</th>
        <th>Action</th>
    </tr>

    <tr th:each="p : ${providers}">
        <td th:text="${p.name}"></td>
        <td th:text="${p.serviceType}"></td>
        <td th:text="${p.location}"></td>
        <td th:text="${p.experience}"></td>
        <td th:text="${p.phone}"></td>

        <td class="review">
            <a th:href="@{'/reviews/' + ${p.id}}" style="color:#0b57d0;">View Reviews</a>
        </td>

        <td>
            <a th:href="@{/book/{id}(id=${p.id})}">
                <button class="book-btn">Book</button>
            </a>
        </td>
    </tr>

</table>

<a href="/client-dashboard"><button class="back-btn">← Back to Dashboard</button></a>

</body>
</html>
