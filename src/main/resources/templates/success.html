<!DOCTYPE html>
<html>
<head>
    <title>Booking Success</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f7ff;
            text-align: center;
            margin-top: 100px;
        }

        .box {
            width: 450px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.2);
        }

        h2 {
            color: green;
        }

        a button {
            margin-top: 25px;
            padding: 12px 35px;
            border: none;
            border-radius: 30px;
            background: #0b57d0;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        a button:hover {
            background: #063a9a;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>✅ Booking Confirmed Successfully!</h2>
    <p>Your appointment has been booked.</p>
    <p style="font-size:14px; color:#555;">The freelancer's phone number will be visible in <strong>My Bookings</strong> once they accept.</p>

    <a href="/client/bookings">
        <button>View My Bookings</button>
    </a>
    <br>
    <a href="/client/dashboard" style="display:inline-block; margin-top:12px; font-size:14px; color:#0b57d0;">← Back to Dashboard</a>
</div>

</body>
</html>
