<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Freelancer Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
body { background:#f4f6f9; }
.sidebar { height:100vh; background:#212529; color:white; padding-top:20px; }
.sidebar a { color:white; text-decoration:none; display:block; padding:12px; }
.sidebar a:hover { background:#343a40; }
.card-box { border-radius:12px; }
</style>
</head>
<body>
<div class="container-fluid">
<div class="row">

<div class="col-md-2 sidebar">
<h4 class="text-center mb-4">Freelancer</h4>
<a href="/freelancer/dashboard"><i class="fa fa-home"></i> Dashboard</a>
<a href="/freelancer/bookings"><i class="fa fa-calendar"></i> My Bookings</a>
<a href="/freelancer/profile"><i class="fa fa-user"></i> Profile</a>
<a href="/logout"><i class="fa fa-sign-out"></i> Logout</a>
</div>

<div class="col-md-10 p-4">
<h2 class="mb-4">Freelancer Dashboard</h2>
<div class="row">

<div class="col-md-4">
<div class="card card-box shadow p-3">
<h5>Total Bookings</h5>
<h3 th:text="${totalBookings}">0</h3>  <!-- ✅ FIXED -->
</div>
</div>

<div class="col-md-4">
<div class="card card-box shadow p-3">
<h5>Pending Requests</h5>
<h3 th:text="${pendingRequests}">0</h3>  <!-- ✅ FIXED -->
</div>
</div>

<div class="col-md-4">
<div class="card card-box shadow p-3">
<h5>Completed Jobs</h5>
<h3 th:text="${completedJobs}">0</h3>  <!-- ✅ FIXED -->
</div>
</div>

</div>
</div>
</div>
</div>
</body>
</html>
