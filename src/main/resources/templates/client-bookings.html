<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">My Bookings</h2>

    <div th:if="${#lists.isEmpty(bookings)}" class="alert alert-info">
        You have no bookings yet.
    </div>

    <table th:unless="${#lists.isEmpty(bookings)}" class="table table-bordered shadow">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Freelancer</th>
            <th>Service</th>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>
            <th>Freelancer Phone</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="booking : ${bookings}">
            <td th:text="${booking.id}"></td>
            <td th:text="${booking.freelancerEmail}"></td>
            <td th:text="${booking.provider.serviceType}"></td>
            <td th:text="${booking.date}"></td>
            <td th:text="${booking.startTime} + ' - ' + ${booking.endTime}"></td>
            <td>
                <span th:text="${booking.status}"
                      th:classappend="${booking.status == 'ACCEPTED'} ? 'text-success fw-bold' :
                                      (${booking.status == 'REJECTED'} ? 'text-danger' : 'text-warning')">
                </span>
            </td>
            <td>
                <!-- Phone only visible after freelancer accepts -->
                <span th:if="${booking.status == 'ACCEPTED'}"
                      th:text="${booking.provider.phone}"
                      class="text-success fw-semibold">
                </span>
                <span th:unless="${booking.status == 'ACCEPTED'}"
                      class="text-muted fst-italic">
                    Available after acceptance
                </span>
            </td>
        </tr>
        </tbody>
    </table>

    <a href="/client/dashboard" class="btn btn-primary mt-2">← Back to Dashboard</a>

</div>

</body>
</html>
